const words=s=>String(s||"").toLowerCase().replace(/[^a-z0-9\u0980-\u09ff]+/g," ").trim().split(" ").filter(Boolean);
const stem=w=>w.length>3&&w.endsWith("s")?w.slice(0,-1):w;
function lev(a,b){const n=a.length,k=b.length,d=[];for(let i=0;i<=n;i++){d[i]=[i];for(let j=1;j<=k;j++)d[i][j]=i?0:j}
 for(let i=1;i<=n;i++)for(let j=1;j<=k;j++){const c=a[i-1]==b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
 return d[n][k]}
function vocab(){const v=new Set();P.forEach(x=>words([x.n,x.c,x.t,x.col||"Gold",x.d].join(" ")).forEach(w=>{if(w.length>2)v.add(stem(w))}));return v}
function fixWords(raw){const voc=vocab(),vl=[...voc];
 return words(raw).map(stem).map(t=>{if(voc.has(t)||vl.some(v=>v.startsWith(t)))return t;
  const lim=t.length<=3?0:t.length<=5?1:t.length<=7?2:3;let best=null,bd=9;
  if(lim)for(const v of vl){if(Math.abs(v.length-t.length)>lim)continue;const d=lev(t,v);if(d<bd){bd=d;best=v}}
  return best&&bd<=lim?best:t})}
function findP(tokens){return P.map(x=>{const nm=words(x.n).map(stem),ot=words([x.c,x.t,x.col||"Gold",skuOf(x),x.d].join(" ")).map(stem);let sc=0;
 for(const t of tokens){let s=0;if(nm.some(w=>w==t))s=4;else if(nm.some(w=>w.startsWith(t)))s=3;else if(t.length>2&&nm.some(w=>w.includes(t)))s=2;else if(ot.some(w=>w.startsWith(t)||(t.length>2&&w.includes(t))))s=1;if(!s)return null;sc+=s}
 return{x,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(r=>r.x)}

function couponBox(){return cpn?`<div class="dl r2" style="margin:14px 0;justify-content:space-between"><span><b style="font-weight:500">${esc(cpn.code)}</b> applied</span><button class="lk2" data-cx style="margin:0">Remove</button></div>`:`<div class="dl" style="margin:14px 0"><div class="r2"><input id="cpi" placeholder="Discount code" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--br);padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);text-transform:uppercase"><button class="btn" data-ap style="padding:10px 18px">Apply</button></div></div>`}
async function applyCode(){const c=($("cpi").value||"").trim().toUpperCase();if(!c)return toast("Enter a code");if(FB.startsWith("PASTE"))return toast("Discount codes are not available yet");
 try{const r=await fetch(FB.replace(/\/$/,"")+"/discounts/"+encodeURIComponent(c)+".json"),d=await r.json(),t=totals();if(!d||d.on===false)return toast("Invalid or expired code");if(t.sale<(+d.min||0))return toast("Add items worth "+inr(d.min)+" to use this code");cpn={code:c,type:d.type,v:+d.v,min:+d.min||0};route(1);toast("Code applied")}catch(_){toast("Could not check the code")}}
function buynow(){
 const t=totals();if(!t.ids.length){location.hash="/cart";return}
 const rows=t.ids.map(i=>{const x=P.find(p=>p.id==i),q=cart[i];return `<div class="ci"><div class="th">${vis(x)}</div><div class="x"><h3>${esc(x.n)}</h3><div class="meta" style="margin:0 0 8px">${esc(x.col||"Gold")} · SKU ${esc(skuOf(x))}</div><div class="r2"><button class="qb" data-q="${esc(i)}" data-d="-1" aria-label="Less">−</button><b style="font-weight:500">${q}</b><button class="qb" data-q="${esc(i)}" data-d="1" aria-label="More">+</button></div></div><b style="font-weight:500">${inr(x.p*q)}</b></div>`}).join("");
 app.innerHTML=`<div class="pg ck" style="padding-bottom:120px"><button class="back" data-back>← Back</button><h2>Order summary</h2>${rows}<div class="dl" style="margin:18px 0"><b style="font-weight:500;display:flex;align-items:center;gap:10px">${TRUCK}Delivery in ${esc(C.delivTxt)}</b></div>${couponBox()}${priceBox(t)}${trust()}</div><div class="sticky"><span class="price"><b style="font-size:20px;font-weight:500">${inr(t.total)}</b><div class="meta" style="margin:0">Total amount</div></span><button class="btn" data-go2>Continue to checkout</button></div>`;goTop()}
function checkout(){
 const t=totals();if(!t.ids.length){location.hash="/cart";return}
 if(USER){if(!cust.n)cust.n=USER.name;if(!cust.e)cust.e=USER.email}
 const v=k=>esc(cust[k]||"");
 app.innerHTML=`<div class="pg ck"><button class="back" data-back>← Back</button><h2>Checkout</h2>${!USER&&authOK()?'<p class="meta">Have an account? <button class="lk2" data-needlogin="/checkout" style="margin:0">Log in</button> to track your order and delivery.</p>':""}<div class="box"><input id="c-n" placeholder="Full name" autocomplete="name" value="${v("n")}"><input id="c-p" placeholder="Phone (10 digits)" inputmode="numeric" maxlength="10" autocomplete="tel" value="${v("p")}"><input id="c-e" type="email" placeholder="Email" autocomplete="email" value="${v("e")}"><textarea id="c-a" rows="3" placeholder="Full delivery address" autocomplete="street-address">${v("a")}</textarea><input id="c-z" placeholder="Pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" value="${v("z")}"></div><div class="dl" style="margin-bottom:14px"><b style="font-weight:500;display:flex;align-items:center;gap:10px">${TRUCK}Delivery in ${esc(C.delivTxt)}</b></div>${priceBox(t)}${payBox()}<button class="btn" id="pay" data-pay style="width:100%">${payLabel(t.total)}</button><p class="meta" style="margin-top:10px;text-align:center">${isCod()?"Pay in cash when your parcel is delivered":rzpReady()?"Secure online payment":""}</p>${cust.n?`<p style="text-align:center"><button class="lk2" data-clr>Clear saved details</button></p>`:""}</div>`;goTop()}
const STEPS=["unfulfilled","packed","shipped","delivered"],SLB={unfulfilled:"Order placed",packed:"Packed",shipped:"Shipped",delivered:"Delivered",cancelled:"Cancelled"};
function trackHTML(d){
 const s=(d&&d.s)||"unfulfilled",i=STEPS.indexOf(s);d=d||{};
 const bar=s=="cancelled"?'<p class="meta" style="color:#b3261e">This order was cancelled</p>':`<div class="steps">${STEPS.map((k,j)=>`<div class="stp${j<=i?" on":""}"><i></i><span>${SLB[k]}</span></div>`).join("")}</div>`;
 const info=[d.city?`Parcel is now in: <b style="font-weight:500">${esc(d.city)}</b>`:"",d.courier?`Courier: <b style="font-weight:500">${esc(d.courier)}</b>`:"",d.awb?`Tracking ID: <b style="font-weight:500">${esc(d.awb)}</b>`:"",d.eta?`Expected delivery: <b style="font-weight:500">${esc(d.eta)}</b>`:""].filter(Boolean);
 const lk=d.url&&/^https?:\/\//.test(d.url)?`<a class="btn o" style="padding:8px 16px;margin-top:6px;font-size:14px" href="${esc(d.url)}" target="_blank" rel="noopener">Track on courier site</a>`:"";
 const log=(d.log||[]).filter(Boolean).slice().reverse().map(l=>`<div class="tl"><i></i><div><b style="font-weight:500">${esc(SLB[l.s]||l.s)}${l.city?" · "+esc(l.city):""}</b>${l.note?`<div class="meta" style="margin:0">${esc(l.note)}</div>`:""}<div class="meta" style="margin:0">${new Date(l.t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</div></div></div>`).join("");
 return bar+(info.length?`<div style="margin:10px 0;line-height:1.8;font-size:14px">${info.join("<br>")}</div>`:"")+lk+(log?`<div class="tls">${log}</div>`:"")}
async function fillStatus(){if(FB.startsWith("PASTE"))return;
 for(const el of document.querySelectorAll(".trk[data-oid]")){const id=el.dataset.oid;if(!id)continue;
  try{const r=await fetch(FB.replace(/\/$/,"")+"/orderstatus/"+encodeURIComponent(id)+".json"),d=await r.json();
   el.innerHTML=trackHTML(d);const st=el.closest(".box").querySelector(".st");if(st)st.textContent=SLB[(d&&d.s)||"unfulfilled"]||"Order placed"}catch(_){}}}
function parseItems(s){return String(s||"").split(", ").map(p=>{const q=p.match(/^(.*) x(\d+)$/);return q?{n:q[1],q:+q[2],p:0}:{n:p,q:1,p:0}}).filter(i=>i.n)}
async function orders(){
 const local=LS.get("aur_orders",[]);let R=null;
 if(USER&&!FB.startsWith("PASTE")){app.innerHTML=`<div class="pg ck"><h2>My orders</h2><p class="sub">Loading…</p></div>`;
  try{const tk=await getTok();if(!tk)throw 0;
   const r=await fetch(FB.replace(/\/$/,"")+"/orders.json?orderBy=%22uid%22&equalTo=%22"+encodeURIComponent(USER.uid)+"%22&auth="+tk),d=await r.json();if(!r.ok)throw 0;
   R=Object.entries(d||{}).map(([id,o])=>({oid:id,id,date:o.t,items:(o.items||[]).filter(Boolean),total:o.total,to:o.name,addr:(o.address||"")+", "+(o.pincode||""),pay:o.pay})).sort((a,b)=>b.date-a.date);
   local.forEach(l=>{if(!R.some(x=>x.oid==(l.oid||l.id)))R.push(l)})}catch(_){R=null}
  if(location.hash!="#/orders")return}
 if(!R)R=local;
 const nudge=!USER&&authOK()?'<p class="meta">Log in to see your orders and delivery updates on any device. <button class="lk2" data-needlogin="/orders" style="margin:0">Log in</button></p>':"";
 app.innerHTML=`<div class="pg ck"><h2>My orders</h2><p class="sub">Track your parcel and see delivery updates here.</p>${nudge}${R.length?R.map(r=>`<div class="box"><div class="row"><b style="font-weight:500">${new Date(r.date).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}</b><span class="meta st" style="margin:0">Order placed</span></div>${(r.items||[]).map(i=>`<div class="sum"><span>${esc(i.n)} × ${i.q}</span><span>${i.p?inr(i.p*i.q):""}</span></div>`).join("")}<div class="sum tot"><b style="font-weight:500">${r.pay=="COD"?"Pay on delivery":"Total paid"}</b><b style="font-weight:500">${inr(r.total)}</b></div><p class="meta" style="margin:0">Order ID: ${esc(String(r.oid||r.id))}<br>Payment: ${r.pay=="COD"?"Cash on Delivery":"Online"}<br>Deliver to: ${esc(r.to)}, ${esc(r.addr)}<br>Expected delivery: ${esc(C.delivTxt)}</p><div class="trk" data-oid="${esc(r.oid||"")}"></div></div>`).join(""):`<p class="empty">No orders yet. <a href="#/">Start shopping</a></p>`}</div>`;goTop();fillStatus()}
function thanks(){
 const id=sessionStorageSafe("rzp_ok");
 app.innerHTML=`<div class="pg" style="text-align:center"><h2>Thank you!</h2><p class="sub">${_mode=="cod"?`Your order is placed. Please keep ${inr(_tot)} ready to pay in cash when your parcel arrives.`:"Your payment was successful."} You can track your parcel in My orders.${id?`<br>Order ID: ${esc(id)}`:""}</p><a class="btn" href="#/">Continue shopping</a></div>`;goTop()}
let _ok="";const sessionStorageSafe=()=>_ok;
function loadRzp(){return new Promise((ok,no)=>{if(window.Razorpay)return ok();const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=ok;s.onerror=()=>no(new Error("Could not load Razorpay. Check your internet."));document.head.appendChild(s)})}
let payM=ENABLE_COD?"cod":"online",_mode="",_tot=0;
const rzpReady=()=>!(RZP_KEY_ID.startsWith("PASTE")||API_BASE.startsWith("PASTE")); // online payment gateway ready? (will switch to Shiprocket later)
const isCod=()=>ENABLE_COD&&(payM=="cod"||!rzpReady());
const payLabel=tot=>(isCod()?"Place order":"Pay")+" "+inr(tot);
function payBox(){const r=rzpReady();if(!ENABLE_COD&&!r)return `<div class="box"><b style="font-weight:500">Payment</b><p class="meta" style="margin:0">Online payment is being set up. Please check back soon.</p></div>`;
 return `<div class="box"><b style="font-weight:500">Payment method</b>${ENABLE_COD?`<label class="dl r2"><input type="radio" name="pm" value="cod" data-pm${isCod()?" checked":""}><span>Cash on Delivery<br><span class="meta" style="margin:0">Pay in cash when your parcel arrives</span></span></label>`:""}${r?`<label class="dl r2"><input type="radio" name="pm" value="online" data-pm${!isCod()?" checked":""}><span>Pay online<br><span class="meta" style="margin:0">UPI, cards, netbanking, wallets</span></span></label>`:""}</div>`}
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.pm!==undefined){payM=e.target.value;const b=$("pay");if(b)b.textContent=payLabel(totals().total)}});
async function placeCod(){
 const t=totals(),btn=$("pay"),lab=btn.textContent;
 if(FB.startsWith("PASTE"))return toast("The store database is not connected yet");
 const sold=t.ids.map(i=>P.find(p=>p.id==i)).find(x=>x&&x.so);if(sold)return toast(sold.n+" is sold out. Please remove it from your bag");
 btn.disabled=true;btn.textContent="Placing your order…";
 const lines=t.ids.map(i=>{const x=P.find(p=>p.id==i);return{id:String(i),n:x.n,q:cart[i],p:x.p}});
 const id="AUR-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
 const rec={t:Date.now(),uid:USER?USER.uid:"",acct:USER?USER.email:"",name:cust.n,phone:cust.p,email:cust.e,address:cust.a,pincode:cust.z,items:lines,sub:t.sale,cd:t.cd,ship:t.ship,plat:t.plat,total:t.total,coupon:cpn?cpn.code:"",pay:"COD"};
 try{const tk=await getTok();
  const r=await fetch(FB.replace(/\/$/,"")+"/orders/"+id+".json"+(tk?"?auth="+tk:""),{method:"PUT",body:JSON.stringify(rec)});
  if(!r.ok)throw new Error("Could not place the order. Please try again.");
  const od=LS.get("aur_orders",[]);od.unshift({id,oid:id,date:rec.t,total:t.total,items:lines,to:cust.n,addr:cust.a+", "+cust.z,pay:"COD"});LS.set("aur_orders",od.slice(0,50));
  _ok=id;_mode="cod";_tot=t.total;cart={};cpn=null;location.hash="/thanks";badges()}
 catch(e){btn.disabled=false;btn.textContent=lab;toast(e.message||"Something went wrong")}}
async function pay(){
 const g=i=>$(i).value.trim();
 cust={n:g("c-n"),p:g("c-p"),e:g("c-e"),a:g("c-a"),z:g("c-z")};
 if(cust.n.length<2)return toast("Enter your name");
 if(!/^\d{10}$/.test(cust.p))return toast("Enter a 10-digit phone number");
 if(!/^\S+@\S+\.\S+$/.test(cust.e))return toast("Enter a valid email");
 if(cust.a.length<8)return toast("Enter your full address");
 if(!/^\d{6}$/.test(cust.z))return toast("Enter a 6-digit pincode");
 LS.set("aur_cust",cust); // address is saved on this device, so the customer does not type it again
 if(isCod())return placeCod();
 if(!rzpReady()){toast("Online payment is not set up yet");return}
 const snap=totals(),lines=snap.ids.map(i=>{const x=P.find(p=>p.id==i);return{n:x.n,q:cart[i],p:x.p}});
 const items=Object.entries(cart).map(([id,qty])=>({id,qty})),btn=$("pay"),label=btn.textContent;
 btn.disabled=true;btn.textContent="Please wait…";
 const done=()=>{btn.disabled=false;btn.textContent=label};
 try{
  const tk=await getTok();
  const r=await fetch(API_BASE+"?action=create",{method:"POST",headers:{"Content-Type":"application/json",...(tk?{Authorization:"Bearer "+tk}:{})},body:JSON.stringify({items,customer:cust,code:cpn&&cpn.code})});
  const o=await r.json();if(!r.ok)throw new Error(o.error||"Could not start payment");
  await loadRzp();
  const rz=new Razorpay({key:RZP_KEY_ID,amount:o.amount,currency:"INR",name:C.storeName,description:"Order from "+C.storeName,order_id:o.order_id,
   prefill:{name:cust.n,email:cust.e,contact:cust.p},notes:{address:cust.a},theme:{color:C.btn},
   modal:{ondismiss:done},
   handler:async resp=>{
    try{const v=await fetch(API_BASE+"?action=verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(resp)});
     const d=await v.json();if(!v.ok||!d.ok)throw new Error(d.error||"Payment could not be verified");
     _ok=resp.razorpay_payment_id;
     const od=LS.get("aur_orders",[]);od.unshift({id:resp.razorpay_payment_id,oid:resp.razorpay_order_id,date:Date.now(),total:snap.total,items:lines,to:cust.n,addr:cust.a+", "+cust.z});LS.set("aur_orders",od.slice(0,50));
     cart={};cpn=null;location.hash="/thanks";badges()}
    catch(e){done();toast(e.message)}}});
  rz.on("payment.failed",x=>{done();toast((x.error&&x.error.description)||"Payment failed. Try again")});
  rz.open();
 }catch(e){done();toast(e.message||"Something went wrong")}}
function route(k){
 keep=k;const h=location.hash.slice(1)||"/";$("sb").style.display=h=="/search"?"block":"none";if(h=="/search")$("q").value=qs;$("drawer").classList.remove("o");
 if(h.startsWith("/product/"))product(h.split("/")[2]);
 else if(h=="/cart")cartv();
 else if(h=="/search")searchv();
 else if(h=="/account")account();
 else if(h=="/orders")orders();
 else if(h=="/buynow")buynow();
 else if(h=="/checkout")checkout();
 else if(h=="/thanks")thanks();
 else if(h=="/wishlist")list(Object.keys(liked),"Liked products","Tap the heart on any product to save it here.");
 else{home();goTop()}
 badges();keep=0}
addEventListener("hashchange",()=>route());
document.addEventListener("click",e=>{
 const t=e.target,g=s=>t.closest(s);let m;
 if(m=g("[data-like]")){e.stopPropagation();const i=m.dataset.like;liked[i]?delete liked[i]:liked[i]=1;toast(liked[i]?"Added to liked products":"Removed from liked products");route(1);return}
 if(m=g("[data-add]")){e.stopPropagation();const i=m.dataset.add;cart[i]=(cart[i]||0)+1;badges();toast("Added to cart");return}
 if(m=g("[data-buy]")){cart[m.dataset.buy]=(cart[m.dataset.buy]||0)+1;location.hash="/buynow";return}
 if(m=g("[data-rm]")){delete cart[m.dataset.rm];route(1);return}
 if(m=g("[data-code]")){try{navigator.clipboard.writeText(m.dataset.code)}catch(_){}toast("Code "+m.dataset.code+" copied");return}
 if(g("[data-checkout]")){location.hash="/buynow";return}
 if(m=g("[data-sl]")){const s=$("sl");if(s)s.scrollBy({left:+m.dataset.sl*s.clientWidth,behavior:"smooth"});return}
 if(g("[data-clr]")){cust={};LS.set("aur_cust",{});route(1);toast("Saved details cleared");return}
 if(g("[data-ap]")){applyCode();return}
 if(m=g("[data-amode]")){amode=m.dataset.amode;account();return}
 if(g("[data-auth]")){doAuth();return}
 if(g("[data-forgot]")){forgot();return}
 if(g("[data-logout]")){USER=null;LS.set("aur_user",null);theme();location.hash="/";toast("Logged out");return}
 if(m=g("[data-needlogin]")){nextHash=m.dataset.needlogin;location.hash="/account";return}
 if(g("#pf")){location.hash="/account";return}
 if(g("[data-cx]")){cpn=null;route(1);return}
 if(g("[data-go2]")){location.hash="/checkout";return}
 if(m=g("[data-q]")){e.stopPropagation();const i=m.dataset.q;cart[i]=(cart[i]||0)+ +m.dataset.d;if(cart[i]<=0)delete cart[i];route(1);return}
 if(g("[data-pay]")){pay();return}
 if(g("[data-back]")){history.length>1?history.back():location.hash="/";return}
 if(g("[data-pin]")){toast(/^\d{6}$/.test($("pc").value)?"Delivery in "+C.delivTxt:"Enter a valid 6-digit pincode");return}
 if(g("[data-scroll]")){e.preventDefault();$("shop")&&$("shop").scrollIntoView({behavior:"smooth"});return}
 if(m=g("[data-cat]")){e.preventDefault();cat=m.dataset.cat;qs="";$("q").value="";if(location.hash.length>2)location.hash="/";else route(1);return}
 if(m=g("[data-go]")){location.hash="/product/"+m.dataset.go;return}
 if(g("#menu"))$("drawer").classList.add("o");
 if(g(".sh"))$("drawer").classList.remove("o");
 if(g("#srch")){const s=$("sb");if(s.style.display=="block"){qs="";$("q").value="";location.hash="/"}else{s.style.display="block";$("q").value=qs;$("q").focus();if(location.hash!="#/search")location.hash="/search"}}
 if(g("#wl"))location.hash="/wishlist";
 if(g("#ct"))location.hash="/cart";
});
$("q").addEventListener("input",e=>{qs=e.target.value;if(location.hash!="#/search")location.hash="/search";else searchv()});
$("q").addEventListener("keydown",e=>{if(e.key=="Enter")e.target.blur()});
async function load(){
 if(FB.startsWith("PASTE"))return;const u=FB.replace(/\/$/,""),j=p=>fetch(u+p+".json").then(r=>r.ok?r.json():null).catch(()=>null);
 const [a,b]=await Promise.all([j("/products"),j("/site")]);
 if(b){C={...D,...b};theme()}
 if(a)setAll(Object.entries(a).map(([id,v])=>({...v,id})).sort((x,y)=>(x.ord||0)-(y.ord||0)));theme();
 if(location.hash!="#/checkout")route(1)}
theme();route();load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
